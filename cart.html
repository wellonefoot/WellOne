<body class="cart-page">
  <header class="header site-header">
    <div class="nav-wrap">
      <button class="header-back" type="button" data-header-back aria-label="Go back" title="Back">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5"></path></svg>
      </button>
      <a class="brand" href="index.html" aria-label="Wellone home"><img src="assets/logo.png?v=50" alt="Wellone logo" width="3144" height="824" decoding="async" fetchpriority="high"></a>
      <nav class="nav" aria-label="Main navigation"><a href="index.html">Home</a><a href="about.html">About Us</a><a href="contact.html">Contact Us</a></nav>
      <div class="header-actions">
        <a class="header-icon header-search" href="catalog.html" aria-label="Search products">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.8"></circle><path d="m16.2 16.2 4.1 4.1"></path></svg>
        </a>
        <a class="header-icon header-cart" href="cart.html" aria-label="Open cart">
          <svg viewBox="0 0 28 28" aria-hidden="true"><path d="M3.5 5.5h3l2.1 11.1a2.2 2.2 0 0 0 2.2 1.8h9.4a2.2 2.2 0 0 0 2.1-1.6l1.8-6.4H8"></path><circle cx="11.2" cy="22.5" r="1.6"></circle><circle cx="20.8" cy="22.5" r="1.6"></circle></svg>
          <span class="header-cart-count" data-cart-count>0</span>
        </a>
        <button class="menu-toggle" type="button" aria-label="Open menu" aria-expanded="false"><span></span><span></span><span></span></button>
      </div>
    </div>
  </header>
  <main>
    <section class="page-head pattern-card">
      <p class="tag">your cart</p>
      <h1>Review cart and confirm.</h1>
    </section>
    <section class="section cart-layout">
      <div id="cartItems" class="cart-list"></div>
      <aside class="cart-summary pattern-card">
        <p class="cart-support-top page-support-line">Support: <a href="tel:+919746476813">+919746476813</a></p>
        <h2>Total: ₹<span id="cartTotal">0</span></h2>
        <div id="pageCartAction" class="cart-action-footer"><button class="btn primary full" type="button" onclick="proceedToCheckout('page')">Proceed to order</button></div>
        <div id="pageCheckoutForm" class="checkout-form checkout-hidden page-checkout-fields">
          <label>Name<input id="customerName" placeholder="Your name"></label>
          <label>Phone<input id="customerPhone" placeholder="Your phone"></label>
          <label>Address<textarea id="customerAddress" rows="3" placeholder="Delivery address"></textarea></label>
          <button class="btn primary full whatsapp-checkout" type="button" onclick="checkoutWhatsApp('page')">Place Order</button>
        </div>
        <button class="btn light full" type="button" onclick="clearCart()" style="margin-top:10px">Clear Cart</button>
      </aside>
    </section>
  </main>
