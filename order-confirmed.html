<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="robots" content="noindex,nofollow">

<body class="order-confirmed-page">
  <main class="order-confirmed-main">
    <section class="confirmation-card">
      <div class="confirmation-check" aria-hidden="true"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="29"></circle><path d="m19 32 9 9 18-20"></path></svg></div>
      <p class="tag">success</p>

      <div class="confirmation-meta"><span><small>Order</small><b id="confirmedOrderNumber">Loading…</b></span><span><small>Total</small><b id="confirmedOrderTotal">—</b></span><span><small>Payment</small><b id="confirmedOrderPayment">—</b></span></div>
      <a id="goToOrderButton" class="btn primary full" href="orders.html">Go to Order Page</a>
      <a class="confirmation-home" href="index.html">Continue shopping</a>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/orders.bundle.js?v=82"></script>
  <script>initOrderConfirmationPage();</script>

</html>
